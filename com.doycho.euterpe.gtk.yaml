id: com.doycho.euterpe.gtk
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: euterpe-gtk
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.secrets
  - --own-name=org.mpris.MediaPlayer2.Euterpe-Gtk
  - --device=dri
modules:
  - python3-requirements.yaml
  - name: euterpe-gtk
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/ironsmile/euterpe-gtk.git
        tag: v0.9.0
        commit: 265d63e72113f50bf9ada3db687977a53d030e5e
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
